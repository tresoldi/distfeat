[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "distfeat"
version = "0.1.0"
description = "Standalone phonological feature systems for historical linguistics"
authors = [
    {name = "Tiago Tresoldi", email = "tiago.tresoldi@lingfil.uu.se"}
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.12"
keywords = [
    "phonology",
    "phonological features",
    "historical linguistics",
    "sequence alignment",
    "cognate detection",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Text Processing :: Linguistic",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov", "ruff", "mypy"]

[project.urls]
Homepage = "https://github.com/tresoldi/distfeat"
Documentation = "https://github.com/tresoldi/distfeat#readme"
Repository = "https://github.com/tresoldi/distfeat"
"Bug Tracker" = "https://github.com/tresoldi/distfeat/issues"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
include = ["distfeat*"]

[tool.setuptools.package-data]
distfeat = ["data/*.tsv"]

[tool.ruff]
target-version = "py312"
line-length = 99

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "SIM", "TCH"]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.coverage.run]
source = ["distfeat"]
omit = ["*/tests/*", "*/test_*"]
